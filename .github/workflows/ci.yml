name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Dev Services (Kafka, PostgreSQL) use the Docker daemon available on ubuntu runners.
      - name: Verify (format, enforcer, tests, ArchUnit, coverage)
        run: ./mvnw -B -ntp verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/jacoco-report
          if-no-files-found: ignore
