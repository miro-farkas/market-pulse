quarkus.application.name=market-pulse

# ---------- Application (bound to @ConfigMapping(prefix = "market-pulse")) ----------
market-pulse.exchange.ws-url=wss://data-stream.binance.vision
market-pulse.exchange.symbols=BTCUSDT,ETHUSDT,SOLUSDT
market-pulse.exchange.reconnect.initial-backoff=1S
market-pulse.exchange.reconnect.max-backoff=30S
market-pulse.exchange.reconnect.jitter=0.2
market-pulse.sse.default-max-rate-per-second=5
market-pulse.outbox.poll-interval=500ms
market-pulse.outbox.batch-size=100
market-pulse.ingestion.max-in-flight=256
# Synthetic ticks for offline work and tests: run with -Dquarkus.profile=dev,simulator (ADR-0006)
market-pulse.source=binance
%simulator.market-pulse.source=simulator
%test.market-pulse.source=simulator
market-pulse.simulator.ticks-per-second=5
market-pulse.simulator.initial-price=100

# ---------- Datasource ----------
# Dev/test: Dev Services start PostgreSQL automatically (Docker required).
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.reactive.url=${DB_REACTIVE_URL}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}

# ---------- Kafka ----------
# Dev/test: Dev Services start a Kafka-compatible broker. Channels are added per backlog item;
# topics/keys/payloads must match docs/architecture.md section 5.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
quarkus.kafka.devservices.topic-partitions."market.ticks"=6
quarkus.kafka.devservices.topic-partitions."market.candles.1m"=6
quarkus.kafka.devservices.topic-partitions."alerts.triggered"=3
quarkus.kafka.devservices.topic-partitions."portfolio.valuations"=3
quarkus.kafka.devservices.topic-partitions."reference-data.changes"=3

# market.ticks: key = symbol, value = TickEvent v1 (JSON)
mp.messaging.outgoing.market-ticks.connector=smallrye-kafka
mp.messaging.outgoing.market-ticks.topic=market.ticks
mp.messaging.outgoing.market-ticks.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---------- Ops ----------
quarkus.smallrye-openapi.info-title=market-pulse API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Reactive, event-driven crypto market data demo: live prices, candles, alerts and portfolio valuations over SSE.
quarkus.swagger-ui.always-include=true
%prod.quarkus.log.console.json=true
# Kafka clients dump their full config at INFO on every producer/consumer start
quarkus.log.category."org.apache.kafka.common.config.AbstractConfig".level=WARN

# ---------- Test ----------
quarkus.jacoco.reuse-data-file=true
